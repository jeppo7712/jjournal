<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />
  <!-- viewport-fit=cover: the page draws edge to edge on notched iPhones and
       keeps clear of the status bar / home indicator itself, using the
       safe-area insets (see styles.css). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <!-- Opened from the iPhone home screen: full screen, light status-bar text
       over the app's own dark background. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Jay's Journal" />
  <meta name="theme-color" content="#1E1E2E" />
  <meta name="description" content="Web-based trading journal for futures traders" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <!-- Inter, the app's typeface (falls back to the system font offline). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <title>Jay's Journal</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <div class="app">
  </div>

  <script>
    // This script should run after the DOM is loaded
    function setViewportHeight() {
      let vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', `${vh}px`);
    }

    // Set initially
    setViewportHeight();

    // Re-set on resize (e.g., orientation change, keyboard appearance/disappearance)
    window.addEventListener('resize', setViewportHeight);
    window.addEventListener('orientationchange', setViewportHeight);

    // Optional: If you use a framework, ensure this runs after app initialization if needed.
    // document.addEventListener('DOMContentLoaded', setViewportHeight); // Sometimes useful for initial load
  </script>
</body>

</html>
